      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

       -     name: Build APK
                 run: gradle -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokCoinsDemo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
